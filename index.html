<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="estrelas"></div>
    <div class="formulario">
        <h1>Login</h1>
        <form>
            <div class="caixa-formulario">
                <input type="text" placeholder="Nome de usuário">
                <i class='bx bxs-user'></i>
            </div>
            <div class="caixa-formulario">
                <input type="password" placeholder="Senha">
                <i class='bx bxs-lock-alt'></i>
            </div>
            <div class="caixa-lembrar-esqueci">
                <label>
                    <input type="Checkbox"> Salvar login
                </label>
                <a
                    href="https://www.google.com/imgres?q=raspa%20de%20parede&imgurl=https%3A%2F%2Flookaside.instagram.com%2Fseo%2Fgoogle_widget%2Fcrawler%2F%3Fmedia_id%3D3697230281702745438&imgrefurl=https%3A%2F%2Fwww.instagram.com%2Freel%2FDNPM1o5taVe%2F&docid=P9bTLZioSPI9oM&tbnid=fV8Awrl1V2eSjM&vet=12ahUKEwiv1b3rxPWWAxUhALkGHfMuHpAQnPAOegQIPRAA..i&w=540&h=960&hcb=2&ved=2ahUKEwiv1b3rxPWWAxUhALkGHfMuHpAQnPAOegQIPRAA">
                    Esqueci minha senha</a>
            </div>
            <button type="submit">Entrar</button>
            <p> Não tem conta? <a
                    href="https://www.google.com/imgres?q=raspa%20de%20parede&imgurl=https%3A%2F%2Flookaside.instagram.com%2Fseo%2Fgoogle_widget%2Fcrawler%2F%3Fmedia_id%3D3697230281702745438&imgrefurl=https%3A%2F%2Fwww.instagram.com%2Freel%2FDNPM1o5taVe%2F&docid=P9bTLZioSPI9oM&tbnid=fV8Awrl1V2eSjM&vet=12ahUKEwiv1b3rxPWWAxUhALkGHfMuHpAQnPAOegQIPRAA..i&w=540&h=960&hcb=2&ved=2ahUKEwiv1b3rxPWWAxUhALkGHfMuHpAQnPAOegQIPRAA">Registrar</a>
            </p>

        </form>
    </div>
</body>

</html>
